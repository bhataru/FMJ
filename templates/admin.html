<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Faizan Mir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-3 sm:p-6 md:p-10 relative overflow-x-hidden">
    
    <!-- Three.js Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="max-w-4xl mx-auto space-y-6 md:space-y-10 relative z-10 w-full box-border">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 backdrop-blur-md bg-slate-950/40 p-4 rounded-xl gap-4 box-border">
            <div class="min-w-0">
                <h1 class="text-xl sm:text-2xl font-bold truncate">Admin Dashboard</h1>
                <p class="text-xs sm:text-sm text-slate-400">Manage portal content, media, and security settings.</p>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <a href="/" class="text-xs sm:text-sm bg-slate-900 border border-slate-800 px-3 sm:px-4 py-2 rounded-lg text-sky-400 hover:bg-slate-800 transition whitespace-nowrap">View Live Site &rarr;</a>
                <button onclick="logoutAdmin()" class="text-xs sm:text-sm bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 sm:px-4 py-2 rounded-lg transition font-medium whitespace-nowrap">Logout</button>
            </div>
        </div>

        <!-- SECTION 1: Publish Story & Media Upload -->
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 p-4 sm:p-6 md:p-8 rounded-xl shadow-2xl box-border">
            <h2 class="text-lg font-semibold mb-6 text-sky-400 border-b border-slate-800 pb-2">Publish Story & Media</h2>
            <form id="story-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-2">Title</label>
                    <input type="text" id="title" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Slug</label>
                    <input type="text" id="slug" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Category (Beat)</label>
                        <select id="category" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border">
                            <option value="Breaking News">Breaking News</option>
                            <option value="Technology">Technology</option>
                            <option value="Editorial">Editorial</option>
                            <option value="Business & Economy">Business & Economy</option>
                            <option value="Culture">Culture</option>
                            <option value="Investigations">Investigations</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Author</label>
                        <input type="text" id="author" value="Faizan Mir" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Publication Date & Time</label>
                        <input type="datetime-local" id="created_at" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 text-sm box-border">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Upload Image / Video File</label>
                    <input type="file" id="media-file" onchange="uploadMedia(event)" class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-2 text-slate-400 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-sky-500 file:text-slate-950 hover:file:bg-sky-400 cursor-pointer box-border">
                    <input type="hidden" id="image_url">
                    <p id="upload-status" class="text-xs text-emerald-400 mt-2 font-medium break-all"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Content</label>
                    <textarea id="content" rows="6" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border"></textarea>
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg transition shadow-lg shadow-sky-500/10 cursor-pointer">Publish Story</button>
            </form>
        </div>

        <!-- SECTION 2: Change Password -->
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 p-4 sm:p-6 md:p-8 rounded-xl shadow-2xl box-border">
            <h2 class="text-lg font-semibold mb-6 text-sky-400 border-b border-slate-800 pb-2">Change Password</h2>
            <form id="password-form" onsubmit="changePassword(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Current Password</label>
                        <input type="password" id="current_password" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">New Password</label>
                        <input type="password" id="new_password" required class="w-full bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-sky-500 box-border">
                    </div>
                </div>
                <button type="submit" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-semibold px-6 py-2.5 rounded-lg transition text-sm cursor-pointer">Update Password</button>
                <p id="password-msg" class="text-xs font-medium mt-2"></p>
            </form>
        </div>

        <!-- SECTION 3: Database Management (Date-wise & Bulk Delete) -->
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 p-4 sm:p-6 md:p-8 rounded-xl shadow-2xl box-border">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 mb-6 gap-4">
                <h2 class="text-lg font-semibold text-sky-400">Database Management (All Stories)</h2>
                <div class="flex flex-wrap items-center justify-between gap-3 w-full sm:w-auto">
                    <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this)" class="rounded bg-slate-950 border-slate-800 text-sky-500 focus:ring-0">
                        Select All Records
                    </label>
                    <button id="batch-delete-btn" onclick="deleteSelectedStories()" disabled class="bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs font-semibold px-3.5 py-2 rounded-lg transition opacity-50 cursor-not-allowed">Delete Selected (<span id="selected-count">0</span>)</button>
                </div>
            </div>
            <div id="admin-stories-list" class="space-y-6 w-full min-w-0">
                <p class="text-slate-400 text-sm">Loading database records...</p>
            </div>
        </div>

    </div>

    <script>
        // --- Three.js Background Animation ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const particlesCount = 350;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 15;
        }

        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.025,
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 4;

        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particlesMesh.rotation.y = elapsedTime * 0.03 + (mouseX * 0.3);
            particlesMesh.rotation.x = elapsedTime * 0.02 + (mouseY * 0.3);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // --- Application Scripts ---

        async function logoutAdmin() {
            try {
                await fetch('/api/admin/logout', { 
                    method: 'POST', 
                    credentials: 'include' 
                });
            } catch (err) {}
            window.location.href = '/admin/login';
        }

        function setDefaultDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('created_at').value = now.toISOString().slice(0, 16);
        }
        setDefaultDateTime();

        document.getElementById('title').addEventListener('input', (e) => {
            document.getElementById('slug').value = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        });

        async function uploadMedia(event) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append("file", file);

            const res = await fetch('/api/admin/upload', { 
                method: 'POST', 
                credentials: 'include',
                body: formData 
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                document.getElementById('image_url').value = data.url;
                document.getElementById('upload-status').innerText = "✔ Uploaded successfully: " + data.url;
            } else {
                alert("File upload failed (Unauthorized or Server Error).");
            }
        }

        document.getElementById('story-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const customDate = document.getElementById('created_at').value;
            
            const res = await fetch('/api/admin/stories', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    slug: document.getElementById('slug').value,
                    category: document.getElementById('category').value,
                    author: document.getElementById('author').value,
                    image_url: document.getElementById('image_url').value || null,
                    content: document.getElementById('content').value,
                    created_at: customDate ? customDate + ":00" : new Date().toISOString()
                })
            });
            if (res.ok) { 
                alert('Story Published Successfully!'); 
                document.getElementById('story-form').reset();
                setDefaultDateTime();
                document.getElementById('upload-status').innerText = '';
                loadAdminStories();
            } else { 
                alert('Error publishing story.'); 
            }
        });

        async function changePassword(event) {
            event.preventDefault();
            const current_password = document.getElementById('current_password').value;
            const new_password = document.getElementById('new_password').value;

            const res = await fetch('/api/admin/password', {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password, new_password })
            });
            const data = await res.json();
            const msgEl = document.getElementById('password-msg');
            msgEl.innerText = data.message || data.detail;
            msgEl.className = res.ok ? "text-xs text-emerald-400 mt-2 font-medium" : "text-xs text-rose-400 mt-2 font-medium";
            if (res.ok) document.getElementById('password-form').reset();
        }

        // --- Date-Wise Loading & Selection Management ---
        async function loadAdminStories() {
            try {
                const res = await fetch('/api/stories', { credentials: 'include' });
                const json = await res.json();
                const container = document.getElementById('admin-stories-list');
                
                if (!json.data || json.data.length === 0) {
                    container.innerHTML = `<p class="text-slate-400 text-sm">No database entries found.</p>`;
                    resetSelectionState();
                    return;
                }

                // Sort descending by publication date
                const sortedStories = json.data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                // Group by formatted Date string
                const groupedByDate = {};
                sortedStories.forEach(story => {
                    const dateKey = new Date(story.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    if (!groupedByDate[dateKey]) groupedByDate[dateKey] = [];
                    groupedByDate[dateKey].push(story);
                });

                // Render Sections with Date-Group Checkboxes (with secure text-wrapping & box-sizing for mobile view)
                container.innerHTML = Object.keys(groupedByDate).map(date => {
                    const storiesHtml = groupedByDate[date].map(story => {
                        const storyId = story.id || story._id;
                        return `
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-950/80 border border-slate-800 p-3 sm:p-4 rounded-lg gap-3 sm:gap-4 w-full box-border">
                                <div class="flex items-start sm:items-center gap-3 w-full min-w-0 overflow-hidden">
                                    <input type="checkbox" value="${storyId}" data-date="${date}" onchange="updateSelectionCount()" class="story-checkbox mt-1 sm:mt-0 rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0 flex-shrink-0">
                                    <div class="space-y-1 min-w-0 flex-grow">
                                        <span class="text-xs uppercase tracking-wider text-sky-400 font-semibold block truncate">🗂️ ${story.category || 'Report'}</span>
                                        <h3 class="font-bold text-slate-100 text-sm sm:text-base break-words">${story.title}</h3>
                                        <p class="text-xs text-slate-400 truncate">By ${story.author || 'Faizan Mir'} • ${new Date(story.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
                                    </div>
                                </div>
                                <button onclick="deleteStory('${storyId}')" class="w-full sm:w-auto bg-rose-500/15 hover:bg-rose-500 text-rose-400 hover:text-slate-950 border border-rose-500/30 text-xs font-semibold px-3 py-2 rounded-md transition whitespace-nowrap cursor-pointer">Delete Record</button>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="space-y-3 w-full box-border">
                            <div class="flex items-center gap-3 w-full">
                                <label class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-300 cursor-pointer whitespace-nowrap">
                                    <input type="checkbox" data-date-group="${date}" onchange="toggleDateGroup(this, '${date}')" class="date-group-checkbox rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0">
                                    📅 ${date}
                                </label>
                                <div class="flex-grow border-t border-slate-800"></div>
                            </div>
                            <div class="space-y-3 w-full box-border">
                                ${storiesHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                resetSelectionState();
            } catch (err) {
                document.getElementById('admin-stories-list').innerHTML = `<p class="text-rose-400 text-sm">Failed to load database records.</p>`;
            }
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.story-checkbox');
            const dateGroupCheckboxes = document.querySelectorAll('.date-group-checkbox');
            
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
            dateGroupCheckboxes.forEach(dcb => dcb.checked = masterCheckbox.checked);
            
            updateSelectionCount();
        }

        function toggleDateGroup(dateMasterCb, date) {
            const checkboxes = document.querySelectorAll(`.story-checkbox[data-date="${date}"]`);
            checkboxes.forEach(cb => cb.checked = dateMasterCb.checked);
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const checkboxes = document.querySelectorAll('.story-checkbox');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const batchBtn = document.getElementById('batch-delete-btn');
            const countSpan = document.getElementById('selected-count');
            const selectAllCb = document.getElementById('select-all-checkbox');

            countSpan.innerText = checkedCount;

            if (checkedCount > 0) {
                batchBtn.removeAttribute('disabled');
                batchBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-rose-500/20', 'text-rose-300');
                batchBtn.classList.add('bg-rose-500', 'text-slate-950', 'hover:bg-rose-400', 'cursor-pointer');
            } else {
                batchBtn.setAttribute('disabled', 'true');
                batchBtn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-rose-500/20', 'text-rose-300');
                batchBtn.classList.remove('bg-rose-500', 'text-slate-950', 'hover:bg-rose-400', 'cursor-pointer');
            }

            // Sync individual date group checkboxes state
            const dateGroupCheckboxes = document.querySelectorAll('.date-group-checkbox');
            dateGroupCheckboxes.forEach(dcb => {
                const dateVal = dcb.getAttribute('data-date-group');
                const groupCheckboxes = document.querySelectorAll(`.story-checkbox[data-date="${dateVal}"]`);
                const groupCheckedCount = Array.from(groupCheckboxes).filter(cb => cb.checked).length;
                
                if (groupCheckboxes.length > 0 && groupCheckedCount === groupCheckboxes.length) {
                    dcb.checked = true;
                } else {
                    dcb.checked = false;
                }
            });

            if (checkboxes.length > 0 && checkedCount === checkboxes.length) {
                selectAllCb.checked = true;
            } else {
                selectAllCb.checked = false;
            }
        }

        function resetSelectionState() {
            document.getElementById('select-all-checkbox').checked = false;
            updateSelectionCount();
        }

        async function deleteStory(id) {
            if (!confirm('Are you sure you want to delete this database record permanently?')) return;
            const res = await fetch(`/api/admin/stories/${id}`, { 
                method: 'DELETE',
                credentials: 'include'
            });
            if (res.ok) {
                loadAdminStories();
            } else {
                alert('Failed to delete story.');
            }
        }

        async function deleteSelectedStories() {
            const selectedCheckboxes = document.querySelectorAll('.story-checkbox:checked');
            if (selectedCheckboxes.length === 0) return;

            if (!confirm(`Are you sure you want to delete ${selectedCheckboxes.length} selected record(s) permanently?`)) return;

            const deletePromises = Array.from(selectedCheckboxes).map(cb => 
                fetch(`/api/admin/stories/${cb.value}`, { 
                    method: 'DELETE',
                    credentials: 'include'
                })
            );

            try {
                const results = await Promise.all(deletePromises);
                const allSuccessful = results.every(res => res.ok);
                if (allSuccessful) {
                    loadAdminStories();
                } else {
                    alert('Some records could not be deleted.');
                    loadAdminStories();
                }
            } catch (err) {
                alert('An error occurred during batch deletion.');
                loadAdminStories();
            }
        }

        // Run on page load
        loadAdminStories();
    </script>
</body>
</html>
