<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizan Mir | Journalist, Writer & Storyteller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Apply theme immediately
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#090d16', cardBg: '#111827' } } }
        }
    </script>
    <style>
        .card-3d { background: linear-gradient(145deg, #162032, #0d1320); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08) inset; backdrop-filter: blur(16px); }
        html:not(.dark) .card-3d { background: linear-gradient(145deg, #ffffff, #f1f5f9); box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.05) inset; }
        .profile-card-inner { box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset; }
        html:not(.dark) .profile-card-inner { box-shadow: 0 10px 25px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05) inset; }
        
        @keyframes fullSpin3D { 0% { transform: perspective(600px) rotateY(0deg); } 100% { transform: perspective(600px) rotateY(360deg); } }
        .text-3d-cursive { font-family: 'Great Vibes', cursive; font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: bold; font-style: italic; display: inline-block; transform-style: preserve-3d; animation: fullSpin3D 10s linear infinite; color: #f8fafc; text-shadow: 0 1px 0 #cbd5e1, 0 2px 0 #94a3b8, 0 3px 0 #64748b, 0 4px 0 #475569, 0 5px 10px rgba(0, 0, 0, 0.6); }
        html:not(.dark) .text-3d-cursive { color: #0f172a; text-shadow: 0 1px 0 #ffffff, 0 2px 0 #cbd5e1, 0 3px 0 #94a3b8, 0 4px 0 #64748b, 0 5px 15px rgba(15, 23, 42, 0.25); }
        .text-3d-cursive:hover { animation-play-state: paused; }
        
        .drawer-link { position: relative; display: inline-block; transition: color 0.3s ease; }
        .drawer-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #38bdf8; transition: width 0.3s ease-in-out; }
        .drawer-link:hover::after { width: 100%; }
        #menu-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkBg text-slate-900 dark:text-slate-100 font-sans min-h-screen relative flex flex-col justify-between py-6 transition-colors duration-300 overflow-x-hidden">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-gradient-to-tr from-sky-600/15 to-indigo-600/15 blur-[140px] rounded-full pointer-events-none"></div>

    <header class="relative z-20 flex justify-between items-center w-full px-4 sm:px-12 mb-6">
        <a href="/"><span class="text-3d-cursive">Faizan Mir</span></a>
        <button onclick="toggleMenu()" class="bg-slate-200 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700/50 px-4 py-2 rounded-full text-slate-700 dark:text-slate-300 hover:text-sky-500 hover:border-sky-500 transition shadow-lg">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <div id="menu-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300" onclick="toggleMenu()"></div>
    <div id="menu-drawer" class="fixed top-0 right-0 w-72 h-full bg-gradient-to-b from-indigo-950 via-purple-900 to-slate-950 text-white z-50 transform translate-x-full shadow-2xl border-l border-white/10 p-8 flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white/10 text-amber-300"><i class="fa-solid fa-sun dark:hidden"></i><i class="fa-solid fa-moon hidden dark:inline"></i></button>
            <button onclick="toggleMenu()" class="text-white/70 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="space-y-6 flex-1 text-lg font-medium">
            <a href="/" class="block drawer-link">Home</a>
            <a href="/photos" class="block drawer-link">Photos</a>
            <a href="/videos" class="block drawer-link">Videos</a>
            <a href="/contact" class="block drawer-link">Contact</a>
        </nav>
        <div class="text-xs text-white/40 pt-4 border-t border-white/10">Designed By Deadend</div>
    </div>

    <main class="relative z-10 w-full max-w-4xl mx-auto px-4 my-auto">
        <div class="card-3d rounded-3xl p-6 sm:p-10 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            <div class="md:col-span-5 w-full h-[400px] rounded-2xl overflow-hidden profile-card-inner">
                <img src="/static/uploads/faizan.png" alt="Faizan Mir" class="w-full h-full object-cover transition-transform duration-700 hover:scale-110">
            </div>
            <div class="md:col-span-7 space-y-4 text-center md:text-left">
                <h1 class="text-4xl font-extrabold">Faizan Mir</h1>
                <p class="text-sky-500 font-semibold uppercase tracking-widest text-xs">Journalist | Writer | Storyteller</p>
                <p class="text-slate-600 dark:text-slate-300">Srinagar-based multimedia journalist focusing on human rights, conflict, environment, and social issues with 9+ years of experience.</p>
                <div class="flex justify-center md:justify-start space-x-4 pt-4">
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center hover:bg-sky-500 hover:text-white transition"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center hover:bg-sky-500 hover:text-white transition"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center hover:bg-sky-500 hover:text-white transition"><i class="fa-brands fa-twitter"></i></a>
                </div>
            </div>
        </div>
    </main>

    <footer class="relative z-10 text-center text-sm text-slate-500 dark:text-slate-400 py-6">
        <p>&copy; <span id="year"></span> Faizan Mir. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        function toggleMenu() {
            const d = document.getElementById('menu-drawer'), b = document.getElementById('menu-backdrop');
            d.classList.toggle('translate-x-0'); d.classList.toggle('translate-x-full');
            b.classList.toggle('hidden'); setTimeout(() => b.classList.toggle('opacity-0'), 10);
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
    </script>
</body>
</html>
