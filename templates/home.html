<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Stories | Faizan Mir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library for Background Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (localStorage.theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111827',
                    }
                }
            }
        }
    </script>
    <style>
        /* Prevent horizontal overflow causing zoom-out / layout shift */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }

        .card-3d {
            background: linear-gradient(145deg, #162032, #0d1320);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            backdrop-filter: blur(16px);
        }
        html:not(.dark) .card-3d {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.05) inset;
        }
        #menu-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .text-3d-cursive {
            font-family: 'Great Vibes', 'Pinyon Script', 'Brush Script MT', cursive, serif;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: bold;
            font-style: italic;
            letter-spacing: 0.05em;
            display: inline-block;
            color: #f8fafc;
            text-shadow: 
                0 1px 0 #cbd5e1,
                0 2px 0 #94a3b8,
                0 3px 0 #64748b,
                0 4px 0 #475569,
                0 5px 10px rgba(0, 0, 0, 0.6),
                0 10px 20px rgba(0, 0, 0, 0.4);
        }
        
        html:not(.dark) .text-3d-cursive {
            color: #0f172a;
            text-shadow: 
                0 1px 0 #ffffff,
                0 2px 0 #cbd5e1,
                0 3px 0 #94a3b8,
                0 4px 0 #64748b,
                0 5px 15px rgba(15, 23, 42, 0.25),
                0 2px 5px rgba(15, 23, 42, 0.15);
        }

        .drawer-link {
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }
        .drawer-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: currentColor;
            transition: width 0.3s ease-in-out;
        }
        .drawer-link:hover::after {
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkBg text-slate-900 dark:text-slate-100 font-sans min-h-screen relative flex flex-col justify-between py-0 px-0 transition-colors duration-300">

    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-gradient-to-tr from-sky-600/15 to-indigo-600/15 blur-[140px] rounded-full pointer-events-none z-0"></div>

    <!-- Premium Header Section -->
    <header class="relative z-20 flex justify-between items-center w-full px-6 sm:px-12 py-3.5 mb-6 bg-slate-900/10 dark:bg-slate-900/60 backdrop-blur-xl border-b border-slate-300/60 dark:border-slate-800/80 shadow-md box-border">
        <a href="/" class="py-1 inline-block">
            <span class="text-3d-cursive">Faizan Mir</span>
        </a>
        <button onclick="toggleMenu()" class="group flex items-center justify-center bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-amber-300 dark:from-slate-800 dark:via-indigo-900 dark:to-slate-800 w-10 h-10 rounded-full hover:scale-105 transition-all duration-300 shadow-[0_4px_20px_rgba(0,0,0,0.3)] cursor-pointer border border-amber-400/30 hover:border-amber-400/70" title="Open Menu">
            <i class="fa-solid fa-bars text-sm text-amber-400 transition-transform group-hover:rotate-90 duration-300"></i>
        </button>
    </header>

    <!-- Slide-out Drawer Menu -->
    <div id="menu-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300" onclick="toggleMenu()"></div>
    <div id="menu-drawer" class="fixed top-0 right-0 w-72 h-full bg-gradient-to-b from-indigo-950 via-purple-900 to-slate-950 text-white z-50 transform translate-x-full shadow-2xl border-l border-white/10 flex flex-col p-8 box-border">
        <div class="flex justify-between items-center mb-10">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-amber-300 shadow-inner hover:scale-105 transition cursor-pointer" title="Toggle Theme">
                <i class="fa-solid fa-sun dark:hidden"></i>
                <i class="fa-solid fa-moon hidden dark:inline"></i>
            </button>
            <button onclick="toggleMenu()" class="text-white/70 hover:text-white hover:scale-110 transition text-lg p-2 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="space-y-6 flex-1 text-lg font-medium">
            <a href="/home" onclick="toggleMenu()" class="block text-white/80 hover:text-emerald-400 drawer-link"><i class="fa-solid fa-house w-6 text-emerald-400 mr-2"></i> Home</a>
            <a href="/photos" onclick="toggleMenu()" class="block text-white/80 hover:text-purple-400 drawer-link"><i class="fa-solid fa-images w-6 text-purple-400 mr-2"></i> Photos</a>
            <a href="/videos" onclick="toggleMenu()" class="block text-white/80 hover:text-rose-400 drawer-link"><i class="fa-solid fa-video w-6 text-rose-400 mr-2"></i> Videos</a>
            <a href="/contact" onclick="toggleMenu()" class="block text-white/80 hover:text-amber-400 drawer-link"><i class="fa-solid fa-envelope w-6 text-amber-400 mr-2"></i> Contact</a>
            <a href="/" onclick="toggleMenu()" class="block text-white/80 hover:text-sky-400 drawer-link"><i class="fa-solid fa-user w-6 text-sky-400 mr-2"></i> About</a>
        </nav>
        <div class="text-xs text-white/40 pt-4 border-t border-white/10">Designed By Deadend</div>
    </div>

    <!-- MAIN RESPONSIVE CONTAINER -->
    <main class="relative z-10 w-full max-w-6xl mx-auto my-auto px-4 sm:px-6 box-border">
        <div class="card-3d rounded-3xl p-4 sm:p-8 md:p-10 border border-slate-200 dark:border-white/10 relative">
            
            <!-- LIVE CLOCK & DATE WIDGET -->
            <div class="flex flex-col sm:flex-row items-center justify-between bg-slate-200/60 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-800/80 rounded-2xl px-4 sm:px-5 py-3 mb-6 text-xs text-slate-700 dark:text-slate-300">
                <div class="flex items-center gap-2 mb-1 sm:mb-0">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span id="live-date" class="font-medium">Loading date...</span>
                </div>
                <div id="live-time" class="font-mono font-semibold text-sky-600 dark:text-sky-400">Loading time...</div>
            </div>

            <div class="text-center mb-6 md:mb-8">
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-1">Recent Stories</h1>
                <p class="text-xs uppercase tracking-widest text-sky-600 dark:text-sky-400 font-semibold">Active Stories Feed (Latest 10)</p>
            </div>

            <!-- Stories Container -->
            <div id="stories-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
                <div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-sky-500 dark:text-sky-400 mb-2 text-xl"></i>
                    <p>Loading stories...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- FULL STORY MODAL VIEW -->
    <div id="story-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4" onclick="closeModalOnOutsideClick(event)">
        <div class="card-3d w-full max-w-2xl max-h-[85vh] overflow-y-auto rounded-3xl p-6 sm:p-8 border border-slate-300 dark:border-white/20 relative shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content-box" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-5 right-5 w-9 h-9 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:text-sky-500 flex items-center justify-center transition shadow z-10 cursor-pointer border-0"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- WEBSITE FOOTER -->
    <footer class="relative z-10 w-full max-w-5xl mx-auto mt-12 mb-6 px-4 pt-6 border-t border-slate-300 dark:border-slate-800 text-center text-sm text-slate-600 dark:text-slate-400 space-y-2 box-border">
        <p>Faizan Mir &copy; <span id="current-year"></span>. All rights reserved.</p>
        <p class="space-x-2">
            <a href="/privacy" class="hover:text-sky-500 dark:hover:text-sky-400 transition">Privacy Policy</a>
            <span>&bull;</span>
            <a href="/terms" class="hover:text-sky-500 dark:hover:text-sky-400 transition">Terms & Conditions</a>
        </p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Live Clock and Date Ticker Script
        function updateLiveClock() {
            const now = new Date();
            const dateOptions = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('live-date').textContent = now.toLocaleDateString(undefined, dateOptions);
            document.getElementById('live-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function formatStoryTimestamp(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date)) return dateString;
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Three.js Background Particle Animation Script (Contained Safely)
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.createElement('div');
            container.style.position = 'fixed';
            container.style.top = '0'; container.style.left = '0';
            container.style.width = '100vw'; container.style.height = '100vh';
            container.style.zIndex = '-1'; container.style.pointerEvents = 'none';
            container.style.overflow = 'hidden';
            document.body.prepend(container);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const particlesCount = 800;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 15; }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const material = new THREE.PointsMaterial({ size: 0.025, color: 0x38bdf8, transparent: true, opacity: 0.7 });
            const mesh = new THREE.Points(geometry, material);
            scene.add(mesh);
            camera.position.z = 4;

            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });

        function toggleMenu() {
            const drawer = document.getElementById('menu-drawer');
            const backdrop = document.getElementById('menu-backdrop');
            const isOpen = drawer.classList.contains('translate-x-0');
            if (isOpen) {
                drawer.classList.remove('translate-x-0');
                drawer.classList.add('translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            } else {
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
                drawer.classList.remove('translate-x-full');
                drawer.classList.add('translate-x-0');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function renderMediaHtml(url, customClass = "absolute inset-0 w-full h-full object-cover") {
            if (!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'webm', 'ogg', 'mov'].includes(ext);

            if (isVideo) {
                return `
                    <video class="${customClass}" muted preload="metadata">
                        <source src="${url}" type="video/${ext === 'mov' ? 'quicktime' : ext}">
                    </video>
                    <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/10 transition">
                        <i class="fa-solid fa-play text-white text-2xl drop-shadow-md"></i>
                    </div>
                `;
            } else {
                return `<img src="${url}" alt="Story Media" class="${customClass} transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&q=80&w=800';">`;
            }
        }

        let allStoriesData = [];

        async function loadStories() {
            const container = document.getElementById('stories-container');
            try {
                const response = await fetch('/api/stories');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                
                const storiesArray = Array.isArray(result) ? result : (result.data || []);

                if (storiesArray.length > 0) {
                    let sortedStories = storiesArray.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    allStoriesData = sortedStories.slice(0, 10);

                    container.innerHTML = allStoriesData.map(s => {
                        const mediaUrl = s.image_url || s.video_url || '';
                        const storyId = s.id || s._id || '';
                        return `
                            <article onclick="openStoryModal('${storyId}')" class="card-3d rounded-2xl border border-slate-200 dark:border-white/10 flex flex-col justify-between overflow-hidden transition hover:-translate-y-1 cursor-pointer group">
                                <div class="w-full h-44 bg-slate-200 dark:bg-slate-900 relative overflow-hidden flex items-center justify-center">
                                    ${mediaUrl ? renderMediaHtml(mediaUrl) : `<img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&q=80&w=800" alt="Default" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">`}
                                </div>
                                <div class="p-4 sm:p-5 flex flex-col justify-between flex-1">
                                    <div>
                                        <span class="text-[10px] uppercase tracking-widest text-sky-500 font-bold">${s.category || 'Journalism'}</span>
                                        <h3 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white mt-1 mb-2 leading-snug group-hover:text-sky-500 transition-colors line-clamp-2">${s.title}</h3>
                                        <p class="text-xs text-slate-600 dark:text-slate-400 line-clamp-3">${s.content}</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center text-[11px] text-slate-500">
                                        <span class="text-sky-600 dark:text-sky-400 font-semibold flex items-center gap-1 group-hover:underline">
                                            <span>Read Report</span>
                                            <i class="fa-solid fa-arrow-right-long"></i>
                                        </span>
                                        <span>${formatStoryTimestamp(s.created_at)}</span>
                                    </div>
                                </div>
                            </article>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-500 dark:text-slate-400 text-sm py-10">No stories available.</div>`;
                }
            } catch (e) {
                console.error("Error loading stories:", e);
                container.innerHTML = `<div class="col-span-full text-center text-red-500 dark:text-red-400 text-sm py-10">Failed to load stories.</div>`;
            }
        }

        function openStoryModal(storyId) {
            const story = allStoriesData.find(s => (s.id == storyId || s._id == storyId));
            if (!story) return;

            const mediaUrl = story.image_url || story.video_url || '';
            const modalBody = document.getElementById('modal-body');
            
            modalBody.innerHTML = `
                <div class="space-y-4">
                    ${mediaUrl ? `<div class="w-full max-h-[350px] rounded-xl overflow-hidden bg-black flex items-center justify-center">${renderMediaModalHtml(mediaUrl)}</div>` : ''}
                    <div>
                        <span class="text-[11px] uppercase tracking-widest text-sky-500 font-bold">${story.category || 'Journalism'}</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1 mb-3 leading-snug">${story.title}</h2>
                        <div class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line space-y-3 pt-2 border-t border-slate-300 dark:border-slate-800">${story.content}</div>
                    </div>
                </div>
            `;

            const modal = document.getElementById('story-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function renderMediaModalHtml(url) {
            if (!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'webm', 'ogg', 'mov'].includes(ext);

            if (isVideo) {
                return `<video src="${url}" class="w-full max-h-[350px] object-contain bg-black" controls autoplay></video>`;
            } else {
                return `<img src="${url}" class="w-full max-h-[350px] object-cover" alt="Story Media">`;
            }
        }

        function closeModalOnOutsideClick(event) {
            if (event.target.id === 'story-modal') {
                closeModal();
            }
        }

        function closeModal() {
            const modal = document.getElementById('story-modal');
            const box = document.getElementById('modal-content-box');
            
            const videoEl = modal.querySelector('video');
            if(videoEl) { videoEl.pause(); }

            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        loadStories();
    </script>
</body>
</html>
